name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gouno-cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: rushairer/gouno-doc/.github/workflows/go-module-quality.yml@f9351d2f9d6fe65fae1dce1b7e442bd64a9646e4
  conventional-pr:
    uses: rushairer/gouno-doc/.github/workflows/conventional-pr.yml@813abc45f3c128ce0e4499de78e03f6d318c2c1d
